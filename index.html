<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدرس الأول: تقنيات التجارة الإلكترونية وطرق الدفع الإلكتروني</title>
<style>:root{
  --ink:#14382F; --ink2:#2C5547; --sage:#8AB79C; --sage-d:#4F8A69; --mist:#EEF5F0; --mist2:#DDEBE2;
  --gold:#D9A93A; --gold-l:#F7E7B8; --coral:#E5576B; --coral-l:#FBE0E4; --sky:#3F87B5; --sky-l:#DCEBF5;
  --ok:#2E9D6A; --ok-l:#D8F1E4; --white:#fff; --txt:#1E2F2A; --muted:#62786F;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --sh:0 6px 22px rgba(20,56,47,.10); --sh2:0 2px 8px rgba(20,56,47,.12);
  --bookw:clamp(300px,34vw,470px);
  --font:'Times New Roman',Times,'Noto Naskh Arabic',serif; --display:'Times New Roman',Times,'Noto Naskh Arabic',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--txt);background:var(--mist);font-size:18px;line-height:1.75;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app shell: book on the LEFT of the screen ---------- */
#app{display:grid;grid-template-columns:var(--bookw) minmax(0,1fr);direction:ltr;height:100vh;height:100dvh}
#app.book-off{grid-template-columns:0 minmax(0,1fr)}
#book{direction:rtl;background:var(--ink);color:#fff;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;z-index:30}
#app.book-off #book{display:none}
#main{direction:rtl;display:flex;flex-direction:column;min-width:0;height:100%;position:relative}

/* book panel */
.book-top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0E2A23}
.book-top b{font-family:var(--display);font-weight:400;font-size:20px;flex:1;letter-spacing:.2px}
.bk-btn{background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:4px 12px;min-width:40px;min-height:40px;font-size:20px;line-height:1;transition:background .2s}
.bk-btn:hover{background:rgba(255,255,255,.25)}
.bk-btn[disabled]{opacity:.35;cursor:default}
.book-view{flex:1;overflow:auto;background:#1a4a3e;padding:12px;display:flex;justify-content:center;align-items:flex-start}
.book-view img{width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:zoom-in;animation:pagein .45s ease}
@keyframes pagein{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.book-nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;background:#0E2A23}
.book-nav span{font-weight:700;min-width:84px;text-align:center}
.book-ph{display:flex;flex-direction:column;gap:6px;color:#cfe3d8;text-align:center;padding:30px}
#bookOpen{display:none;position:fixed;left:12px;bottom:76px;z-index:40;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;box-shadow:var(--sh);font-weight:700}
#app.book-off ~ #bookOpen, #bookOpen.show{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(100deg,var(--ink) 0%,#1F5444 100%);color:#fff;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.3vw,30px);line-height:1.2;flex:1;min-width:200px}
.top h1 small{display:block;font-family:var(--font);font-size:13px;color:#BFDACB;font-weight:500}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 14px;font-weight:700;font-size:16px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill.gold{background:var(--gold);color:#3b2d00}
.pill.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.25)}100%{transform:scale(1)}}
.timer.late{background:var(--gold);color:#3b2d00}

/* trail (stage stepper) */
.trail{display:flex;align-items:flex-start;padding:10px 12px 4px;background:#fff;border-bottom:2px solid var(--mist2);overflow-x:auto;gap:0}
.st{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.st::before{content:"";position:absolute;top:19px;right:50%;width:100%;height:4px;background:var(--mist2);z-index:0}
.st:last-child::before{display:none}
.st.done::before{background:var(--gold)}
.st i{z-index:1;width:42px;height:42px;border-radius:50%;background:var(--mist2);color:var(--ink2);display:grid;place-items:center;font-style:normal;border:3px solid #fff;box-shadow:var(--sh2);transition:all .35s}
.st i svg{width:24px;height:24px}
.st.done i{background:var(--gold);color:#3b2d00}
.st.on i{background:var(--ink);color:#fff;transform:scale(1.18);box-shadow:0 0 0 6px rgba(138,183,156,.45);animation:beat 2s infinite}
.st.on{color:var(--ink)}
@keyframes beat{50%{box-shadow:0 0 0 11px rgba(138,183,156,.12)}}
.st.jump{cursor:pointer}

/* strategy ribbon */
.ribbon{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 18px;background:var(--gold-l);border-bottom:2px solid #EBD590;font-weight:700;color:#5a4300;font-size:16px}
.ribbon .tag{background:#fff;border-radius:999px;padding:0 12px;display:flex;gap:6px;align-items:center;border:2px solid var(--gold)}
.ribbon .tag svg{width:20px;height:20px}
.ribbon .role{margin-inline-start:auto;font-weight:500;font-size:15px}

/* stage area */
#stageWrap{flex:1;overflow:auto;padding:18px clamp(12px,2.2vw,30px) 24px;scroll-behavior:smooth}
#stage{max-width:1050px;margin:0 auto;animation:stagein .55s cubic-bezier(.2,.8,.2,1)}
@keyframes stagein{from{opacity:0;transform:translateX(-42px) scale(.985)}to{opacity:1;transform:none}}
.stage-out{animation:stageout .25s ease forwards}
@keyframes stageout{to{opacity:0;transform:translateX(40px)}}
.foot{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-top:2px solid var(--mist2)}
.foot .msg{flex:1;color:var(--muted);font-size:15px}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:8px 26px;font-weight:800;box-shadow:var(--sh2);transition:transform .15s,background .2s,opacity .2s;min-height:46px}
.btn:hover{transform:translateY(-2px);background:#1E5242}
.btn:active{transform:none}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.btn.gold{background:var(--gold);color:#3b2d00}.btn.gold:hover{background:#E4B84C}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--sage)}.btn.ghost:hover{background:var(--mist)}
.btn.sm{padding:3px 16px;min-height:36px;font-size:15px}
.btn.coral{background:var(--coral)}

/* generic blocks */
.card{background:#fff;border-radius:var(--r-lg);padding:20px 24px;box-shadow:var(--sh);border:2px solid #E3EEE7}
.card + .card{margin-top:14px}
h2.t{font-family:var(--display);font-weight:400;font-size:clamp(24px,3vw,36px);color:var(--ink);line-height:1.3;margin-bottom:6px}
h3.t{font-family:var(--display);font-weight:400;font-size:clamp(19px,2.2vw,26px);color:var(--ink2);margin-bottom:4px}
.lead{color:var(--muted);font-size:17px;margin-bottom:10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
.grow{flex:1;min-width:240px}
.hint-btn{color:var(--sky);font-weight:700;text-decoration:underline;font-size:15px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--mist2);border-radius:10px;padding:0 12px;font-weight:700;font-size:15px}
.chip.lvl{background:var(--sky-l);color:#17517a}
.chip.pg{background:var(--gold-l);color:#6a4e00;cursor:pointer}
.chip.pg:hover{background:#F3DC94}
.callout{border-radius:var(--r-md);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;font-size:17px}
.callout svg{flex:none;width:34px;height:34px}
.callout.warn{background:var(--coral-l);border:2px solid #F1A9B3;color:#6a1220}
.callout.info{background:var(--sky-l);border:2px solid #9CC6E1;color:#123e5e}
.callout.good{background:var(--ok-l);border:2px solid #92D2B1;color:#0f4a2f}
.callout.gold{background:var(--gold-l);border:2px solid #EBD590;color:#5a4300}
.bullets{list-style:none;display:grid;gap:8px;margin:8px 0}
.bullets li{display:flex;gap:10px;align-items:flex-start}
.bullets li::before{content:"";flex:none;width:12px;height:12px;margin-top:11px;border-radius:50%;background:var(--sage-d);box-shadow:0 0 0 4px var(--mist2)}
.en{font-family:Segoe UI,Tahoma,sans-serif;direction:ltr;unicode-bidi:isolate;font-size:.85em;color:var(--sage-d);font-weight:700}
.big-ico{width:120px;height:120px;flex:none}
.big-ico svg{width:100%;height:100%}

/* welcome */
.welcome{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
@media(max-width:900px){.welcome{grid-template-columns:1fr}}
.obj{display:grid;gap:10px;margin-top:8px}
.obj div{display:flex;gap:12px;align-items:center;background:var(--mist);border-radius:var(--r-md);padding:8px 14px;font-weight:700}
.obj svg{width:36px;height:36px;flex:none}
.field{display:grid;gap:4px;margin-bottom:12px;font-weight:700}
.field input,.field textarea,.field select{border:2px solid var(--sage);border-radius:var(--r-md);padding:8px 14px;background:#fff;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid var(--gold-l);border-color:var(--gold)}

/* quiz */
.qwrap{position:relative}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.dots{display:flex;gap:6px;margin-inline-start:auto}
.dots b{width:16px;height:16px;border-radius:50%;background:var(--mist2);transition:all .3s}
.dots b.on{background:var(--sage-d);transform:scale(1.25)}
.dots b.ok{background:var(--ok)}.dots b.no{background:var(--coral)}
.qtext{font-size:clamp(19px,2.1vw,24px);font-weight:800;line-height:1.7;margin:8px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:start;background:#fff;border:3px solid var(--mist2);border-radius:var(--r-md);padding:10px 16px;font-weight:600;transition:all .18s;font-size:18px}
.opt:hover:not([disabled]){border-color:var(--sage);transform:translateX(-4px);background:var(--mist)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--mist2);display:grid;place-items:center;font-weight:800}
.opt.right{background:var(--ok-l);border-color:var(--ok);animation:pop .5s}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--coral-l);border-color:var(--coral);animation:shake .4s}
.opt.wrong .k{background:var(--coral);color:#fff}
.opt[disabled]{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:24px;font-family:var(--display);padding:14px}
@keyframes shake{20%,60%{transform:translateX(9px)}40%,80%{transform:translateX(-9px)}}
.fb{margin-top:14px;border-radius:var(--r-md);padding:12px 16px;animation:stagein .4s}
.fb.ok{background:var(--ok-l);border:2px solid var(--ok)}
.fb.no{background:var(--coral-l);border:2px solid var(--coral)}
.fb.hint{background:var(--sky-l);border:2px solid #9CC6E1}
.fb b{font-family:var(--display);font-weight:400;font-size:21px}
.fbrow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}

/* slides (tech cards) */
.slide{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start}
@media(max-width:700px){.slide{grid-template-columns:1fr}.big-ico{width:90px;height:90px}}
.slide .art{background:linear-gradient(160deg,var(--mist2),#fff);border-radius:var(--r-lg);padding:14px;display:grid;place-items:center;border:2px dashed var(--sage);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(-1.5deg)}}
.slide .num{font-family:var(--display);color:var(--sage-d);font-size:20px}
.snav{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.snav .dots{margin:0 auto}
.dots button{width:18px;height:18px;border-radius:50%;background:var(--mist2);transition:all .25s}
.dots button.on{background:var(--ink);transform:scale(1.3)}
.dots button.seen{background:var(--gold)}
.ex-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ex-grid span{background:var(--gold-l);border:2px solid #EBD590;border-radius:10px;padding:0 12px;font-weight:700;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.colhead{font-family:var(--display);font-size:24px;padding:6px 16px;border-radius:12px;color:#fff;margin-bottom:8px;text-align:center}
.colhead.a{background:var(--sky)}.colhead.b{background:var(--ink2)}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 20px;border-radius:999px;background:#fff;border:3px solid var(--mist2);font-weight:800;display:flex;gap:8px;align-items:center;transition:all .2s}
.tab svg{width:24px;height:24px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.seen:not(.on){border-color:var(--gold)}
.tab.seen::after{content:"✓";color:var(--ok);font-weight:900}
.tab.on.seen::after{color:var(--gold)}
.pane{animation:stagein .4s}

/* key tiles */
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.key{background:#fff;border:3px solid var(--mist2);border-radius:var(--r-md);padding:10px 8px;text-align:center;font-weight:800;font-size:16px;line-height:1.4;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.key:hover{transform:translateY(-4px) rotate(-1deg);border-color:var(--sage)}
.key svg{width:44px;height:44px}
.key.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.key.seen::after{content:"✓";position:absolute;top:4px;left:8px;color:var(--ok);font-weight:900}
.key.on.seen::after{color:var(--gold)}

/* crossword */
.cw-wrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
@media(max-width:860px){.cw-wrap{grid-template-columns:1fr}}
.cw-grid{display:grid;gap:3px;direction:rtl;justify-content:center;margin:0 auto}
.cw-grid{--cw:44px}.cw-cell{position:relative;width:var(--cw);height:var(--cw)}
@media(max-width:700px){.cw-grid{--cw:30px}.cw-cell input{font-size:17px;border-radius:5px}}
.cw-cell input{width:100%;height:100%;text-align:center;font-weight:800;font-size:24px;border:2px solid var(--ink2);border-radius:8px;background:#fff;padding:0;caret-color:var(--gold)}
.cw-cell input:focus{background:var(--gold-l);border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(217,169,58,.45)}
.cw-cell.hl input{background:var(--mist)}
.cw-cell.ok input{background:var(--ok-l);border-color:var(--ok);color:#0f4a2f;animation:pop .5s}
.cw-cell.bad input{background:var(--coral-l);border-color:var(--coral);animation:shake .4s}
.cw-cell small{position:absolute;top:1px;right:4px;font-size:11px;font-weight:800;color:var(--sage-d);pointer-events:none}
.clues h3{margin-top:6px}
.clue{display:flex;gap:10px;padding:8px 12px;border-radius:12px;cursor:pointer;border:2px solid transparent;margin-bottom:6px;background:var(--mist)}
.clue:hover,.clue.on{border-color:var(--gold);background:var(--gold-l)}
.clue.done{background:var(--ok-l);border-color:var(--ok)}
.clue b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px}
.clue small{color:var(--muted);display:block;font-size:13px}
.title-reveal{margin-top:14px;padding:12px 16px;background:var(--ink);color:#fff;border-radius:var(--r-lg);text-align:center}
.title-reveal .tw{display:inline-block;min-width:64px;margin:3px 5px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.12);font-family:var(--display);font-size:clamp(22px,3vw,34px);line-height:1.5;color:transparent;transition:all .6s}
.title-reveal .tw.show{background:var(--gold);color:#2e2300;animation:pop .6s}
.title-reveal small{display:block;color:#BFDACB}

/* exit cards */
.ex-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;perspective:900px}
.xc{height:170px;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer;border-radius:var(--r-lg)}
.xc.flip{transform:rotateY(180deg)}
.xc .f,.xc .b{position:absolute;inset:0;border-radius:var(--r-lg);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--sh)}
.xc .f{background:linear-gradient(150deg,var(--sage-d),var(--ink));color:#fff;border:4px solid var(--gold)}
.xc .f b{font-family:var(--display);font-weight:400;font-size:64px;line-height:1}
.xc .f svg{width:40px;height:40px}
.xc .b{transform:rotateY(180deg);background:#fff;border:4px solid var(--mist2);font-weight:800;text-align:center;padding:8px}
.xc.ok .b{border-color:var(--ok);background:var(--ok-l)}
.xc.no .b{border-color:var(--coral);background:var(--coral-l)}
.xc .b span{font-size:44px;line-height:1}
.xc:hover:not(.flip){transform:translateY(-6px) rotate(-1.5deg)}
.xc.lock{pointer-events:none}
.xq{position:fixed;inset:0;background:rgba(14,42,35,.72);display:grid;place-items:center;z-index:80;padding:16px;animation:fade .25s}
.xq .card{max-width:720px;width:100%;max-height:92vh;overflow:auto;animation:pop .45s}
@keyframes fade{from{opacity:0}}

/* spot / mini-games */
.stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.stars .off{color:#d7e3dc}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:4px;width:130px;text-align:center;font-weight:800;font-size:15px;line-height:1.3;animation:pop .7s}
.badge svg{width:76px;height:76px}
.badges{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.score-big{font-family:var(--display);font-size:64px;color:var(--ink);line-height:1}
.self{display:grid;gap:8px;margin:8px 0}
.self .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--mist);padding:8px 14px;border-radius:var(--r-md);font-weight:700}
.self .r span:first-child{flex:1;min-width:200px}
.emo{display:flex;gap:6px}
.emo button{font-size:28px;filter:grayscale(1);opacity:.55;border-radius:50%;width:48px;height:48px;transition:all .2s}
.emo button.on{filter:none;opacity:1;transform:scale(1.2);background:var(--gold-l)}

/* toast + confetti */
#toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-30px);background:var(--ink);color:#fff;padding:6px 22px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:all .35s;z-index:100;box-shadow:var(--sh)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:120}
.teacher{position:fixed;bottom:112px;left:8px;direction:rtl;z-index:90;background:#fff;border:3px solid var(--coral);border-radius:14px;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:14px;box-shadow:var(--sh)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:110;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start;direction:ltr}
.zoom img{width:min(1100px,100%);height:auto;background:#fff;border-radius:6px;cursor:zoom-out}
.zoom button{position:fixed;top:14px;left:14px;font-size:22px;background:#fff;border-radius:999px;width:46px;height:46px;z-index:2}

/* ---------- store simulator ---------- */
.sim{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){.sim{grid-template-columns:1fr}}
.coach{position:sticky;top:0;background:#fff;border:3px solid var(--gold);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh)}
.coach h3{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.coach ol{list-style:none;display:grid;gap:5px;margin:8px 0;counter-reset:c}
.coach li{counter-increment:c;display:flex;gap:8px;align-items:flex-start;font-size:15.5px;line-height:1.5;padding:4px 8px;border-radius:10px;color:var(--muted);transition:all .3s}

<script>/* ===== محرك الدرس التفاعلي: مشترك بين الدرسين ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s||'').replace(/[ً-ٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').trim();
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const callout=(t,ik,html)=>`<div class="callout ${t}">${ICON[ik]||''}<div>${html}</div></div>`;
const bullets=a=>`<ul class="bullets">${a.map(x=>`<li><span>${x}</span></li>`).join('')}</ul>`;
const pageChip=n=>n?`<button class="chip pg" data-page="${n}" title="افتحي الصفحة في الكتاب">📖 ص ${AR(n)}</button>`:'';

let CFG=null;
const ST={name:'',group:'',points:0,streak:0,best:0,sec:{},stage:-1,t0:0,tStage:0,badges:[],self:{},reflection:'',teacher:/teacher/.test(location.hash),sound:false,done:{}};

/* ---------- sound / fx ---------- */
let AC=null;
function beep(f=660,d=.12,t='sine'){ if(!ST.sound)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){} }
const sndOK=()=>{beep(660,.1);setTimeout(()=>beep(880,.14),90)}, sndNO=()=>beep(180,.22,'square');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2000)}
let parts=[],raf=0;
function confetti(n=70,ox,oy){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#D9A93A','#8AB79C','#E5576B','#3F87B5','#14382F','#F7E7B8'];
 for(let i=0;i<n;i++)parts.push({x:ox??innerWidth/2,y:oy??innerHeight*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*11-3,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,l:1});
 cancelAnimationFrame(raf);
 const tick=()=>{x.clearRect(0,0,c.width,c.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.l-=.011;x.save();x.globalAlpha=Math.max(p.l,0);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});parts=parts.filter(p=>p.l>0&&p.y<c.height+30);if(parts.length)raf=requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)};tick()}
function speak(t){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ')); u.lang='ar-SA'; u.rate=.92; speechSynthesis.speak(u) }

/* ---------- points ---------- */
function sec(key){return ST.sec[key]||(ST.sec[key]={pts:0,max:0,right:0,n:0,graded:true})}
function addPts(n,key='bonus',opts={}){
  ST.points+=n; if(key){const s=sec(key);s.pts+=n;if(opts.graded===false)s.graded=false}
  const p=$('#ptsPill');if(p){p.querySelector('b').textContent=AR(ST.points);p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}
}
function streak(ok){ if(ok){ST.streak++;ST.best=Math.max(ST.best,ST.streak)}else ST.streak=0; const s=$('#strPill b');if(s)s.textContent=AR(ST.streak); if(ok&&ST.streak>=3)toast('🔥 سلسلة '+AR(ST.streak)+' إجابات صحيحة!') }
function award(id,label,ik){ if(ST.badges.find(b=>b.id===id))return; ST.badges.push({id,label,ik}); toast('🏅 شارة جديدة: '+label); confetti(60) }

/* ---------- book panel (left of the screen) ---------- */
let bi=0;
function showBook(i){ const P=CFG.book.pages; bi=Math.max(0,Math.min(P.length-1,i)); const v=$('#bookView');
  v.innerHTML=`<img alt="صفحة ${P[bi].n} من الكتاب" src="${P[bi].src}">`; $('#bkLbl').textContent='ص '+AR(P[bi].n); $('#bkPrev').disabled=bi===P.length-1; $('#bkNext').disabled=bi===0; v.scrollTop=0;
  $('img',v).onclick=()=>zoom(P[bi].src) }
function setBook(n){ const i=CFG.book.pages.findIndex(p=>p.n==n); if(i>=0&&i!==bi)showBook(i) }
function openBook(n){ setBook(n); $('#app').classList.remove('book-off'); $('#app').classList.add('sheet-open') }
function zoom(src){ const z=document.createElement('div');z.className='zoom';z.innerHTML=`<button aria-label="إغلاق">✕</button><img src="${src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z) }
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){openBook(+b.dataset.page)}});

/* ---------- reusable: one question (MCQ / TF) ---------- */
function renderQ(box,item,o){
  let tries=o.tries||1,used=0,finished=false;
  const isTF=item.type==='tf';
  const order=isTF?[0,1]:shuffle(item.options.map((_,i)=>i));
  const labels=['أ','ب','ج','د','هـ'];
  const opts=isTF?['صح ✓','خطأ ✗']:order.map(i=>item.options[i]);
  const correctIdx=isTF?(item.answer?0:1):order.indexOf(item.answer);
  box.innerHTML=`<div class="qhead">${o.level?`<span class="chip lvl">🧠 ${esc(o.level)}</span>`:''}${o.head||''}</div>
   <div class="qtext">${item.q}</div>
   <div class="opts ${isTF?'tf':''}">${opts.map((t,i)=>`<button class="opt" data-i="${i}"><span class="k">${isTF?(i?'✗':'✓'):labels[i]}</span><span>${isTF?'':t}${isTF?(i?'خطأ':'صح'):''}</span></button>`).join('')}</div><div class="fbbox"></div>`;
  const fb=$('.fbbox',box);
  const finish=(ok,pts)=>{ finished=true; $$('.opt',box).forEach(b=>b.disabled=true);
    $$('.opt',box)[correctIdx].classList.add('right');
    fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?(item.praise||'أحسنتِ! إجابة صحيحة 🌟'):'الإجابة الصحيحة موضّحة بالأخضر'}</b><div>${item.why||''}</div><div class="fbrow">${pageChip(item.page)}${ok&&pts?`<span class="chip">+${AR(pts)} نقطة</span>`:''}<button class="btn sm gold" id="qNext">${o.nextLabel||'التالي'} ←</button></div></div>`;
    $('#qNext',box).onclick=()=>o.onNext&&o.onNext({ok,pts,tries:used});
    ok?sndOK():sndNO(); if(ok)confetti(26,undefined,innerHeight*.5);
    o.onFinal&&o.onFinal({ok,pts,tries:used}) };
  $$('.opt',box).forEach(b=>b.onclick=()=>{ if(finished)return; const i=+b.dataset.i; used++;
    if(i===correctIdx){ const pts=used===1?10:(used===2?5:2); b.classList.add('right'); finish(true,pts) }
    else{ b.classList.add('wrong'); b.disabled=true; tries--; sndNO();
      if(tries<=0){ finish(false,0) }
      else fb.innerHTML=`<div class="fb hint"><b>قريبة! جرّبي مرة أخرى 💡</b><div>${item.hint||'ارجعي إلى الكتاب على اليسار وتأكدي من المعلومة.'}</div><div class="fbrow">${pageChip(item.page)}</div></div>` } });
}
/* quiz: sequence of questions */
function quiz(el,o){
  let i=0,right=0; const S=sec(o.key);S.max+=o.items.length*10;S.n+=o.items.length; if(o.graded===false)S.graded=false;
  el.innerHTML=`<div class="card qwrap"><div class="qhead"><h3 class="t">${o.icon?ICON[o.icon].replace('<svg','<svg width="34" height="34"'):''} ${o.title}</h3><div class="dots">${o.items.map(()=>'<b></b>').join('')}</div></div><div id="qbox"></div></div>`;
  const dots=$$('.dots b',el);
  const go=()=>{ dots.forEach((d,k)=>d.classList.toggle('on',k===i&&!d.className.includes('ok')&&!d.className.includes('no')));
    const it=o.items[i]; if(it.page)setBook(it.page);
    renderQ($('#qbox',el),it,{tries:o.tries||2,level:it.level,nextLabel:i===o.items.length-1?'إنهاء':'التالي',
      onFinal:r=>{ dots[i].className=r.ok?'ok':'no'; streak(r.ok); if(r.ok){right++;S.right++} addPts(r.pts,o.key); },
      onNext:()=>{ i++; if(i<o.items.length)go(); else end() } }) };
  const end=()=>{ const pct=Math.round(right/o.items.length*100);
    $('#qbox',el).innerHTML=`<div style="text-align:center;padding:10px"><div class="big-ico" style="margin:auto">${ICON.trophy}</div><h3 class="t">${right===o.items.length?'ممتاز! أجبتِ عن الأسئلة كلها بنجاح':'أنهيتِ هذه المرحلة'}</h3><p class="lead">أجبتِ إجابة صحيحة عن ${AR(right)} من ${AR(o.items.length)} أسئلة</p></div>`;
    if(pct===100&&o.badge)award(o.badge[0],o.badge[1],o.badge[2]);
    confetti(pct===100?90:40); o.onDone&&o.onDone({right,total:o.items.length}) };
  go();
}

/* ---------- slides / carousel ---------- */
function slides(el,o){
  let k=0; const seen=new Set([0]);
  el.innerHTML=`<div class="card"><div id="sl"></div><div class="snav"><button class="btn ghost sm" id="sP">→ السابق</button><div class="dots" id="sD">${o.items.map((_,i)=>`<button aria-label="بطاقة ${i+1}"></button>`).join('')}</div><button class="btn sm" id="sN">التالي ←</button></div></div>`;
  const draw=()=>{ const s=o.items[k]; seen.add(k); const box=$('#sl',el);
    box.innerHTML=`<div class="pane">${o.render(s,k)}</div>`; if(s.page)setBook(s.page);
    $$('#sD button',el).forEach((b,i)=>b.className=(i===k?'on':'')+(seen.has(i)&&i!==k?' seen':''));
    $('#sP',el).disabled=k===0; $('#sN',el).disabled=k===o.items.length-1;
    const sp=$('[data-say]',box); if(sp)sp.onclick=()=>speak(sp.dataset.say);
    o.after&&o.after(box,s,k);
    if(seen.size===o.items.length)o.onSeenAll&&o.onSeenAll() };
  $('#sP',el).onclick=()=>{k--;draw()}; $('#sN',el).onclick=()=>{k++;draw()};
  $$('#sD button',el).forEach((b,i)=>b.onclick=()=>{k=i;draw()}); draw();
}

/* ---------- crossword ---------- */
function crossword(el,o){
  const W=o.words; let R=0,C=0; const cells={};
  W.forEach((w,wi)=>{ w.cells=[]; [...w.ans].forEach((ch,j)=>{ const r=w.row+(w.dir==='v'?j:0),c=w.col+(w.dir==='h'?j:0); R=Math.max(R,r+1);C=Math.max(C,c+1); const key=r+','+c; (cells[key]=cells[key]||{r,c,ch,words:[],num:0}).words.push(wi); if(cells[key].ch!==ch)console.error('تعارض في الشبكة',key); w.cells.push(key) }) });
  W.forEach((w,wi)=>{ w.no=wi+1; cells[w.cells[0]].num=cells[w.cells[0]].num||w.no; w.done=false });
  el.innerHTML=`<div class="cw-wrap"><div><div class="cw-grid" id="cg" style="grid-template-columns:repeat(${C},var(--cw));grid-template-rows:repeat(${R},var(--cw))"></div></div>
   <div class="clues"><h3 class="t">التلميحات (من الكتاب)</h3><div id="cl"></div><div class="fbrow"><button class="btn sm" id="cwChk">تحقّقي من الحل ✓</button><button class="btn ghost sm" id="cwHint">💡 تلميح حرف (−٢ نقطة)</button></div><div id="cwMsg"></div></div></div>
   <div class="title-reveal"><small>${o.revealLabel||'اكتشفي عنوان درس اليوم'}</small><div id="tr">${o.title.map((t,i)=>`<span class="tw" data-w="${i}">${esc(t)}</span>`).join('')}</div></div>`;
  const g=$('#cg',el);
  Object.values(cells).forEach(cl=>{ const d=document.createElement('div'); d.className='cw-cell'; d.style.gridRow=cl.r+1; d.style.gridColumn=cl.c+1; d.dataset.k=cl.r+','+cl.c;
    d.innerHTML=`${cl.num?`<small>${AR(cl.num)}</small>`:''}<input maxlength="1" inputmode="text" lang="ar" dir="rtl" aria-label="خانة">`; g.appendChild(d) });
  const cellEl=k=>$(`.cw-cell[data-k="${k}"]`,g), inp=k=>$('input',cellEl(k));
  let cur=0;
  const hl=wi=>{cur=wi;$$('.cw-cell',g).forEach(c=>c.classList.remove('hl'));W[wi].cells.forEach(k=>cellEl(k).classList.add('hl'));$$('.clue',el).forEach((c,i)=>c.classList.toggle('on',i===wi));const w=W[wi]; if(w.page)setBook(w.page)};
  $('#cl',el).innerHTML=W.map((w,i)=>`<div class="clue" data-w="${i}"><b>${AR(w.no)}</b><div>${w.clue}<small>${w.dir==='h'?'أفقي ⟵':'عمودي ⬇'} · ${AR(w.ans.length)} حروف</small></div></div>`).join('');
  $$('.clue',el).forEach(c=>c.onclick=()=>{hl(+c.dataset.w);const w=W[+c.dataset.w];const f=w.cells.find(k=>!inp(k).value)||w.cells[0];inp(f).focus()});
  Object.values(cells).forEach(cl=>{ const k=cl.r+','+cl.c,i=inp(k);
    i.onfocus=()=>{ const wi=cl.words.includes(cur)?cur:cl.words[0]; hl(wi) };
    i.oninput=()=>{ i.value=i.value.replace(/[^؀-ۿ]/g,'').slice(-1); if(!i.value)return; const w=W[cur],idx=w.cells.indexOf(k); const nx=w.cells[idx+1]; if(nx)inp(nx).focus() };
    i.onkeydown=e=>{ if(e.key==='Backspace'&&!i.value){const w=W[cur],idx=w.cells.indexOf(k);if(idx>0){inp(w.cells[idx-1]).focus()}} if(e.key==='Enter')$('#cwChk',el).click() };
  });
  const fin=()=>{ if(W.every(w=>w.done)){ $$('#tr .tw',el).forEach((t,i)=>setTimeout(()=>t.classList.add('show'),i*350)); confetti(110); award('cw','حلّالة الألغاز','puzzle'); $('#cwMsg',el).innerHTML=`<div class="fb ok" style="margin-top:10px"><b>رائع! اكتمل العنوان 🎉</b><div>${o.endMsg||''}</div></div>`; o.onDone&&o.onDone() } };
  $('#cwChk',el).onclick=()=>{ let any=false; W.forEach((w,wi)=>{ if(w.done)return; const got=w.cells.map(k=>inp(k).value).join(''); if(!got)return; any=true;
      if(norm(got)===norm(w.ans)){ w.done=true; w.cells.forEach((k,j)=>{const c=cellEl(k);c.classList.remove('bad');c.classList.add('ok');inp(k).value=w.ans[j];inp(k).readOnly=true}); $$('.clue',el)[wi].classList.add('done'); addPts(8,'cw',{graded:false}); sndOK(); toast('✓ كلمة صحيحة +٨'); if(w.reveal!=null)$$('#tr .tw',el)[w.reveal].classList.add('show') }
      else{ w.cells.forEach(k=>{const c=cellEl(k);if(!c.classList.contains('ok')){c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),700)}}); sndNO() } });
    if(!any)toast('اكتبي بعض الحروف أولًا'); fin() };
  $('#cwHint',el).onclick=()=>{ const w=W[cur]; const k=w.cells.find(k=>norm(inp(k).value)!==norm(cells[k].ch)); if(k){inp(k).value=cells[k].ch;addPts(-2,'cw',{graded:false});toast('−٢ نقطة')} };
  hl(0);
}

    if(CFG.scriptUrl){ try{ await fetch(CFG.scriptUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); $('#sendSt').textContent='✅ تم إرسال نتيجتك إلى معلمتك' }catch(e){ $('#sendSt').textContent='⚠️ تعذّر الإرسال، أخبري معلمتك'; b.disabled=false } }
    else $('#sendSt').textContent='✅ حُفظت نتيجتك على هذا الجهاز (اطلبي من معلمتك تصديرها)'; };
}
function exportCSV(){ let a=[];try{a=JSON.parse(localStorage.getItem('res_'+CFG.id)||'[]')}catch(e){} if(!a.length){toast('لا توجد نتائج محفوظة');return}
  const k=['time','name','group','points','accuracy','stars','bestStreak','minutes','badges','self','reflection']; const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='﻿'+k.join(',')+'\n'+a.map(r=>k.map(x=>q(r[x])).join(',')).join('\n'); const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); const l=document.createElement('a');l.href=u;l.download=CFG.id+'-results.csv';l.click() }

const TECH=[
 {no:'١',title:'التقنية: العمود الفقري للتجارة الإلكترونية',icon:'laptop',page:111,intro:true,

 {no:'التقنية ٣',title:'التسويق الإلكتروني',en:'E-Marketing',icon:'megaphone',page:112,

 {no:'التقنية ٤',title:'التبادل الإلكتروني للبيانات',en:'Electronic Data Interchange (EDI)',icon:'docs',page:112,

 {no:'الطريقة ٢',title:'نظام الدفع بواسطة الهاتف المحمول',en:'Mobile payment system',icon:'phone',page:113,

  ${bullets(['اعتمدت مصارف كثيرة التقنية في تطبيقاتها المصرفية، فيستطيع العملاء إرسال الأموال وتسديد الفواتير وإجراء تعاملاتهم المصرفية المختلفة مباشرة من حساباتهم.','يمكن إجراء الدفع من الهاتف في المتاجر بـ<b>مسح الرمز الشريطي (barcode)</b> عبر أحد تطبيقات الهاتف، والخدمة متاحة في متاجر ونقاط بيع محلية وعالمية كثيرة.','يمكن الدفع بتقنية <b>الاتصال قريب المدى (NFC)</b>: يكفي لمس الهاتف لقارئ NFC ليعمل تمامًا كبطاقة الائتمان الخاصة بالدفع بنظام <b>البطاقة الذكية غير التلامسية (Contactless Payment)</b>. ويرتبط الهاتف بمؤسسة مالية كالمصرف أو شركة بطاقة ائتمان، كما هو مرتبط بمزوّد خدمة الهاتف، وتتم عملية الدفع عبر البروتوكولات الخاصة بهذه المؤسسة المالية.'])}`},

 {no:'الطريقة ٤',title:'الدفع عبر الشبكة الإلكترونية',icon:'laptop',page:114,

 {no:'الطريقة ٥',title:'خدمة الفواتير من خلال البريد الإلكتروني',icon:'mail',page:114,
